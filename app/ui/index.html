<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontext Meeting Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .status-bar.disconnected {
            background: #e2e8f0;
            color: #2d3748;
        }

        .status-bar.connected {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-bar.recording {
            background: #fed7d7;
            color: #742a2a;
        }

        .pulse {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f56565;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #0078D7;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #005a9e;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #e53e3e;
        }

        .content-box {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 12px;
        }

        .content-box:empty::before {
            content: attr(data-placeholder);
            color: #a0aec0;
            font-style: italic;
        }

        .transcript-item,
        .summary-item {
            margin-bottom: 12px;
            padding: 12px;
            background: white;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        /* Streaming transcript styling */
        .transcript-interim {
            border-left-color: #a0aec0;
            background: #f7fafc;
            opacity: 0.75;  /* Dimmed interim results */
        }

        .transcript-final {
            border-left-color: #667eea;
            background: white;
            opacity: 1;  /* Full opacity for final results */
        }

        .timestamp {
            font-size: 12px;
            color: #718096;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .final-summary {
            background: #fefcbf;
            border-left-color: #d69e2e;
            padding: 16px;
        }

        .final-summary h4 {
            margin-bottom: 8px;
            color: #744210;
        }

        .chat-input-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .chat-input-group input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }

        .chat-input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .agent-replies {
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .agent-reply {
            padding: 12px;
            margin-bottom: 8px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #48bb78;
        }

        .user-message {
            padding: 12px;
            margin-bottom: 8px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            margin-left: 40px;
        }

        h3 {
            color: #2d3748;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meeting-info {
            font-size: 14px;
            color: #718096;
            margin-top: 8px;
            padding: 8px;
            background: #f7fafc;
            border-radius: 6px;
        }

        .audio-info {
            font-size: 14px;
            color: #4a5568;
            padding: 12px;
            background: #edf2f7;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 Kontext Meeting Assistant</h1>
            <p>Automatically captures microphone + system audio</p>
        </div>

        <div class="card">
            <div class="status-bar disconnected" id="statusBar">
                <span class="pulse hidden" id="pulseIndicator"></span>
                <span id="statusText">Ready to record</span>
            </div>

            <div class="audio-info">
                <strong>🎧 Audio Capture:</strong><br>
                <span id="audioStatus">Click "Start Meeting" to begin capturing audio from microphone and system</span>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="startBtn" onclick="startMeeting()">
                    ▶️ Start Meeting
                </button>
                <button class="btn btn-danger" id="stopBtn" onclick="stopMeeting()" disabled>
                    ⏹️ Stop Meeting
                </button>
            </div>

            <div class="meeting-info hidden" id="meetingInfo"></div>
        </div>

        <div class="card">
            <h3>📝 Live Transcripts</h3>
            <div class="content-box" id="transcripts" data-placeholder="Transcripts will appear here as you speak..."></div>
        </div>

        <div class="card">
            <h3>📊 Summaries</h3>
            <div class="content-box" id="summaries" data-placeholder="Periodic summaries will appear here..."></div>
        </div>

        <div class="card">
            <h3>💬 Ask Kontext Agent / Post-Meeting Commands</h3>
            <div class="chat-input-group">
                <input 
                    type="text" 
                    id="chatInput" 
                    placeholder="e.g., 'Send meeting summary to john@pivot.co' or 'Push summary to Notion'"
                    onkeypress="if(event.key==='Enter') sendChatMessage()"
                >
                <button class="btn btn-primary" id="sendBtn" onclick="sendChatMessage()">
                    Send
                </button>
            </div>
            <div class="agent-replies" id="agentReplies"></div>
        </div>
    </div>

    <script>
        // Global state
        let ws = null;
        let meetingId = null;
        let audioContext = null;
        let audioWorkletNode = null;
        let isRecording = false;
        let chunkCounter = 0;

        // WebSocket connection
        async function connectWebSocket() {
            return new Promise((resolve, reject) => {
                meetingId = meetingId || crypto.randomUUID();
                const url = `ws://localhost:8000/ws/meeting`;
                console.log('Connecting WebSocket:', url);
                
                const socket = new WebSocket(url);

                socket.onopen = () => {
                    console.log('WebSocket connected');
                    updateStatus('connected', 'Connected');
                    resolve(socket);
                };

                socket.onerror = (err) => {
                    console.error('WebSocket error:', err);
                    updateStatus('disconnected', 'Connection error');
                    reject(err);
                };

                socket.onclose = () => {
                    console.log('WebSocket closed');
                };
            });
        }

        // Start meeting
        async function startMeeting() {
            try {
                // Connect WebSocket
                ws = await connectWebSocket();
                ws.onmessage = handleWebSocketMessage;

                // Send START message
                ws.send(JSON.stringify({
                    type: 'START',
                    metadata: {
                        title: 'Meeting ' + new Date().toLocaleString(),
                        participants: []
                    }
                }));

                // Setup audio capture - AUTOMATIC (mic + system if available)
                await setupAudioCapture();

                isRecording = true;
                updateStatus('recording', 'Recording...');
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('meetingInfo').classList.remove('hidden');
                document.getElementById('meetingInfo').textContent = `Meeting ID: ${meetingId}`;

            } catch (error) {
                console.error('Failed to start meeting:', error);
                alert('Failed to start meeting: ' + error.message);
                updateStatus('disconnected', 'Error: ' + error.message);
            }
        }

        // Setup audio capture - STREAMING MODE (10-20ms frames for real-time)
        async function setupAudioCapture() {
            try {
                // Get microphone stream with minimal processing to preserve audio quality
                const micStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,  // Disable: removes ~50% of speech
                        noiseSuppression: false,  // Disable: removes consonants/fricatives
                        autoGainControl: false,   // Disable: compresses dynamics, creates artifacts
                        sampleRate: 16000,
                        channelCount: 1
                    }
                });

                document.getElementById('audioStatus').innerHTML = 
                    '✅ Capturing: <strong>Microphone</strong> (Streaming Mode)<br>' +
                    '<small>10-20ms frames • Real-time transcription</small>';

                // Create AudioContext for processing
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000
                });

                // Create source from mic
                const source = audioContext.createMediaStreamSource(micStream);

                // STREAMING MODE: Use AnalyserNode + getByteFrequencyData for continuous streaming
                // Create ScriptProcessor with SMALLER buffer for real-time streaming (10-20ms frames)
                // 16000 Hz sample rate: 
                // - 512 samples = 32ms (too large)
                // - 256 samples = 16ms (good for streaming)
                // - 128 samples = 8ms (too frequent, overhead)
                
                const streamingFrameSize = 256;  // 16ms frames at 16kHz
                const processor = audioContext.createScriptProcessor(streamingFrameSize, 1, 1);
                
                let frameCounter = 0;
                let pendingFrames = [];  // Buffer frames for batch sending (optional optimization)
                
                processor.onaudioprocess = (e) => {
                    if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;

                    const inputData = e.inputBuffer.getChannelData(0);
                    
                    // Convert float32 (-1 to 1) to int16 PCM
                    const pcmData = new Int16Array(inputData.length);
                    let maxAmp = 0;
                    
                    // First pass: convert and find max amplitude
                    for (let i = 0; i < inputData.length; i++) {
                        const s = Math.max(-1, Math.min(1, inputData[i]));
                        pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        maxAmp = Math.max(maxAmp, Math.abs(pcmData[i]));
                    }
                    
                    // NORMALIZE: If audio is too quiet, boost it to proper level
                    // Target: -20dB (amplitude ~25000/32767 ≈ 0.76)
                    if (maxAmp > 0 && maxAmp < 12000) {  // If quieter than -20dB
                        const targetAmplitude = 25000;  // 76% of int16 range
                        const scale = targetAmplitude / maxAmp;
                        
                        // Second pass: normalize
                        for (let i = 0; i < pcmData.length; i++) {
                            pcmData[i] = Math.max(-32768, Math.min(32767, Math.floor(pcmData[i] * scale)));
                        }
                    }

                    // Send as base64 (STREAMING: smaller frames, more frequent)
                    const base64 = arrayBufferToBase64(pcmData.buffer);
                    
                    // STREAMING MODE: Send AUDIO_FRAME (not AUDIO_CHUNK)
                    // Small frames every 16-20ms instead of 500ms chunks
                    ws.send(JSON.stringify({
                        type: 'AUDIO_FRAME',  // Changed from AUDIO_CHUNK to distinguish streaming
                        meeting_id: meetingId,
                        data: base64,
                        frame_index: frameCounter++,  // Changed from chunk_index
                        frame_size_ms: (streamingFrameSize / 16000 * 1000),  // ~16ms
                        timestamp: Date.now() / 1000
                    }));
                };

                // Connect audio graph
                source.connect(processor);
                processor.connect(audioContext.destination);

                // Store for cleanup
                window.audioProcessor = processor;
                window.audioSource = source;
                window.micStream = micStream;

                console.log('Audio capture setup complete (STREAMING MODE: 16ms frames)');

            } catch (error) {
                console.error('Audio setup failed:', error);
                throw error;
            }
        }

        // Stop meeting
        async function stopMeeting() {
            isRecording = false;

            // Stop audio processing
            if (window.audioProcessor) {
                window.audioProcessor.disconnect();
                window.audioProcessor = null;
            }
            if (window.audioSource) {
                window.audioSource.disconnect();
                window.audioSource = null;
            }
            if (window.micStream) {
                window.micStream.getTracks().forEach(track => track.stop());
                window.micStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            // Send STOP
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'STOP',
                    meeting_id: meetingId
                }));
            }

            updateStatus('connected', 'Stopped (you can still chat)');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('audioStatus').textContent = 'Recording stopped';
        }

        // Handle WebSocket messages
        function handleWebSocketMessage(event) {
            try {
                const data = JSON.parse(event.data);
                console.log('Received:', data.type);

                if (data.type === 'MEETING_STARTED') {
                    meetingId = data.meeting_id;
                    console.log('Meeting started:', meetingId);
                }
                // STREAMING MODE: Handle TRANSCRIPT_PARTIAL (interim results)
                else if (data.type === 'TRANSCRIPT_PARTIAL') {
                    addTranscriptPartial(data.text, data.is_final, data.timestamp);
                }
                // BATCH MODE or final result: Handle TRANSCRIPT_UPDATE
                else if (data.type === 'TRANSCRIPT_UPDATE' || data.type === 'transcript_update') {
                    addTranscript(data.text);
                }
                else if (data.type === 'SUMMARY_UPDATE' || data.type === 'summary_update') {
                    addSummary(data.summary, data.timestamp);
                }
                else if (data.type === 'FINAL_SUMMARY' || data.type === 'final_summary') {
                    addFinalSummary(data.summary || data.content);
                }
                else if (data.type === 'CHAT_RESPONSE' || data.type === 'agent_reply') {
                    addAgentReply(data.message || data.content);
                }

            } catch (err) {
                console.warn('Message parse error:', err);
            }
        }

        // Send chat message
        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;

            // Reconnect if needed
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.log('Reconnecting WebSocket...');
                ws = await connectWebSocket();
                ws.onmessage = handleWebSocketMessage;
            }

            // Send CHAT message
            ws.send(JSON.stringify({
                type: 'CHAT',
                meeting_id: meetingId,
                message: message
            }));

            // Display user message
            const div = document.createElement('div');
            div.className = 'user-message';
            div.textContent = 'You: ' + message;
            document.getElementById('agentReplies').appendChild(div);
            
            input.value = '';
            scrollToBottom('agentReplies');
        }

        // UI Update Functions
        function updateStatus(type, text) {
            const statusBar = document.getElementById('statusBar');
            const pulse = document.getElementById('pulseIndicator');
            const statusText = document.getElementById('statusText');

            statusBar.className = 'status-bar ' + type;
            statusText.textContent = text;

            if (type === 'recording') {
                pulse.classList.remove('hidden');
            } else {
                pulse.classList.add('hidden');
            }
        }

        // Handle streaming partial transcripts (interim results)
        let currentPartialElement = null;
        let interimStartTime = null;
        
        function addTranscriptPartial(text, isFinal, timestamp) {
            const container = document.getElementById('transcripts');
            
            // If final, convert interim to final or create new final item
            if (isFinal) {
                if (currentPartialElement) {
                    // Upgrade existing interim element to final
                    currentPartialElement.classList.remove('transcript-interim');
                    currentPartialElement.classList.add('transcript-final');
                    
                    // Update text to final styling
                    const textDiv = currentPartialElement.querySelector('div:nth-child(2)');
                    textDiv.style.color = '#1a202c';
                    textDiv.style.fontWeight = '600';
                    textDiv.style.opacity = '1';
                    textDiv.style.fontStyle = 'normal';
                    
                    // Remove LIVE badge
                    const liveBadge = currentPartialElement.querySelector('div:nth-child(3)');
                    if (liveBadge) {
                        liveBadge.remove();
                    }
                    
                    currentPartialElement = null;
                } else {
                    // Create new final item (shouldn't happen, but fallback)
                    const div = document.createElement('div');
                    div.className = 'transcript-item transcript-final';
                    div.innerHTML = `
                        <div class="timestamp">${new Date().toLocaleTimeString()}</div>
                        <div style="font-weight: 600; color: #1a202c;">${text}</div>
                    `;
                    container.appendChild(div);
                }
                scrollToBottom('transcripts');
            } else {
                // If interim (partial), update or create interim element
                if (!currentPartialElement) {
                    interimStartTime = new Date().toLocaleTimeString();
                    currentPartialElement = document.createElement('div');
                    currentPartialElement.className = 'transcript-item transcript-interim';
                    currentPartialElement.innerHTML = `
                        <div class="timestamp">${interimStartTime}</div>
                        <div style="color: #4a5568; opacity: 0.7; font-style: italic;"></div>
                        <div style="font-size: 11px; color: #a0aec0; margin-top: 4px; display: flex; align-items: center; gap: 6px;">
                            <span style="display: inline-block; width: 6px; height: 6px; background: #f56565; border-radius: 50%; animation: pulse 1.5s infinite;"></span>
                            LIVE
                        </div>
                    `;
                    container.appendChild(currentPartialElement);
                }
                // Update interim text only (don't recreate)
                const textDiv = currentPartialElement.querySelector('div:nth-child(2)');
                if (textDiv) {
                    textDiv.textContent = text;
                }
                scrollToBottom('transcripts');
            }
        }

        function addTranscript(text) {
            const container = document.getElementById('transcripts');
            
            // If there's an interim element, upgrade it to final instead of creating duplicate
            if (currentPartialElement) {
                currentPartialElement.classList.remove('transcript-interim');
                currentPartialElement.classList.add('transcript-final');
                
                const textDiv = currentPartialElement.querySelector('div:nth-child(2)');
                textDiv.textContent = text;
                textDiv.style.color = '#1a202c';
                textDiv.style.fontWeight = '600';
                textDiv.style.opacity = '1';
                textDiv.style.fontStyle = 'normal';
                
                const liveBadge = currentPartialElement.querySelector('div:nth-child(3)');
                if (liveBadge) {
                    liveBadge.remove();
                }
                
                currentPartialElement = null;
            } else {
                // No interim element, create new final item
                const div = document.createElement('div');
                div.className = 'transcript-item transcript-final';
                div.innerHTML = `
                    <div class="timestamp">${new Date().toLocaleTimeString()}</div>
                    <div style="font-weight: 600; color: #1a202c;">${text}</div>
                `;
                container.appendChild(div);
            }
            scrollToBottom('transcripts');
        }

        function addSummary(summary, timestamp) {
            const container = document.getElementById('summaries');
            const div = document.createElement('div');
            div.className = 'summary-item';
            
            const summaryText = typeof summary === 'object' ? summary.overview || JSON.stringify(summary) : summary;
            
            div.innerHTML = `
                <div class="timestamp">${timestamp || new Date().toLocaleTimeString()}</div>
                <div>${summaryText}</div>
            `;
            container.appendChild(div);
            scrollToBottom('summaries');
        }

        function addFinalSummary(summary) {
            const container = document.getElementById('summaries');
            const div = document.createElement('div');
            div.className = 'final-summary';
            
            let html = '<h4>📋 Final Summary</h4>';
            
            if (typeof summary === 'object') {
                if (summary.overview) {
                    html += `<p><strong>Overview:</strong> ${summary.overview}</p>`;
                }
                if (summary.key_points && summary.key_points.length > 0) {
                    html += '<p><strong>Key Points:</strong></p><ul>';
                    summary.key_points.forEach(point => {
                        html += `<li>${point}</li>`;
                    });
                    html += '</ul>';
                }
                if (summary.decisions && summary.decisions.length > 0) {
                    html += '<p><strong>Decisions:</strong></p><ul>';
                    summary.decisions.forEach(decision => {
                        html += `<li>${decision}</li>`;
                    });
                    html += '</ul>';
                }
                if (summary.action_items && summary.action_items.length > 0) {
                    html += '<p><strong>Action Items:</strong></p><ul>';
                    summary.action_items.forEach(item => {
                        html += `<li>${item}</li>`;
                    });
                    html += '</ul>';
                }
            } else {
                html += `<p>${summary}</p>`;
            }
            
            div.innerHTML = html;
            container.appendChild(div);
            scrollToBottom('summaries');
        }

        function addAgentReply(content) {
            const container = document.getElementById('agentReplies');
            const div = document.createElement('div');
            div.className = 'agent-reply';
            div.innerHTML = `<strong>Kontext Agent:</strong><br>${content}`;
            container.appendChild(div);
            scrollToBottom('agentReplies');
        }

        function scrollToBottom(elementId) {
            const element = document.getElementById(elementId);
            element.scrollTop = element.scrollHeight;
        }

        // Utility function
        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }
    </script>
</body>
</html>
